<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAS - Advanced Comment Analysis System</title>
    <script src="i18n.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        html.rtl {
            direction: rtl;
        }

        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .language-switcher button {
            padding: 8px 16px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .language-switcher button:hover,
        .language-switcher button.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1000px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }

        .auth-logo {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 15px;
            backdrop-filter: blur(10px);
        }

        .tab-container {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-button {
            flex: 1;
            padding: 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            transition: all 0.3s ease;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-button.active {
            color: #667eea;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 35px 30px;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .role-option {
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            background: white;
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .role-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .role-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            color: #667eea;
            font-weight: 700;
        }

        .role-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .error-message,
        .success-message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .error-message.visible {
            display: block;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .success-message.visible {
            display: block;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .submit-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        .submit-button.loading .spinner {
            display: block;
        }

        .submit-button.loading span {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .toggle-text button {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s ease;
            padding: 0;
            font-size: inherit;
        }

        .toggle-text button:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .field-error {
            color: #c62828;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-group.invalid input,
        .form-group.invalid select {
            border-color: #c62828;
            background: rgba(198, 40, 40, 0.05);
        }

        .form-group.invalid .field-error {
            display: block;
        }

        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: #f44336;
        }

        .password-strength-bar.medium {
            width: 66%;
            background: #ff9800;
        }

        .password-strength-bar.strong {
            width: 100%;
            background: #4caf50;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .auth-wrapper {
                max-width: 100%;
                border-radius: 10px;
            }

            .auth-header {
                padding: 30px 20px;
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .tab-content {
                padding: 25px 20px;
            }

            .role-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="ar">العربية</button>
    </div>

    <div class="container">
        <div class="auth-wrapper">
            <div class="auth-header">
                <div class="auth-logo">📊</div>
                <h1 data-i18n="common.appName">ACAS Dashboard</h1>
                <p data-i18n="common.appDescription">Advanced Comment Analysis System</p>
            </div>

            <div class="tab-container">
                <button class="tab-button active" data-tab="login" data-i18n="auth.login">Login</button>
                <button class="tab-button" data-tab="register" data-i18n="auth.register">Register</button>
            </div>

            <!-- LOGIN TAB -->
            <div id="login" class="tab-content active">
                <div id="login-alert" class="error-message"></div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label data-i18n="auth.username">Username</label>
                        <input type="text" name="username" id="login-username" 
                               data-i18n-placeholder="auth.username" placeholder="Username" required>
                        <div class="field-error" data-i18n="auth.requiredField">This field is required</div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="auth.password">Password</label>
                        <input type="password" name="password" id="login-password" 
                               data-i18n-placeholder="auth.password" placeholder="Password" required>
                        <div class="field-error" data-i18n="auth.requiredField">This field is required</div>
                    </div>

                    <button type="submit" class="submit-button" data-i18n="auth.loginButton">
                        <span>Login</span>
                        <div class="spinner"></div>
                    </button>

                    <div class="toggle-text">
                        <span data-i18n="auth.noAccount">Don't have an account?</span>
                        <button type="button" onclick="switchTab('register')" data-i18n="auth.register">Register</button>
                    </div>
                </form>
            </div>

            <!-- REGISTER TAB -->
            <div id="register" class="tab-content">
                <div id="register-alert" class="error-message"></div>
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label data-i18n="auth.username">Username</label>
                        <input type="text" name="username" id="register-username" 
                               data-i18n-placeholder="auth.username" placeholder="Username" minlength="3" required>
                        <div class="field-error" data-i18n="auth.minLength">Minimum 3 characters</div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="auth.email">Email (Optional)</label>
                        <input type="email" name="email" id="register-email" 
                               data-i18n-placeholder="auth.email" placeholder="Email">
                        <div class="field-error" data-i18n="auth.invalidEmail">Invalid email address</div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="auth.password">Password</label>
                        <input type="password" name="password" id="register-password" 
                               data-i18n-placeholder="auth.password" placeholder="Password" minlength="6" required
                               oninput="updatePasswordStrength(this.value)">
                        <div class="password-strength">
                            <div id="password-strength-bar" class="password-strength-bar"></div>
                        </div>
                        <div class="field-error" data-i18n="auth.passwordHint">At least 6 characters</div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="auth.confirmPassword">Confirm Password</label>
                        <input type="password" name="confirmPassword" id="register-confirm" 
                               data-i18n-placeholder="auth.confirmPassword" placeholder="Confirm Password" required>
                        <div class="field-error" data-i18n="auth.passwordsMismatch">Passwords don't match</div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="auth.role">User Role</label>
                        <div class="role-selector" id="role-selector">
                            <div class="role-option" data-role="user">
                                <div class="role-icon">👤</div>
                                <div data-i18n="auth.roleUser">User</div>
                            </div>
                            <div class="role-option" data-role="manager">
                                <div class="role-icon">👔</div>
                                <div data-i18n="auth.roleManager">Manager</div>
                            </div>
                            <div class="role-option" data-role="admin">
                                <div class="role-icon">👨‍💼</div>
                                <div data-i18n="auth.roleAdmin">Admin</div>
                            </div>
                        </div>
                        <input type="hidden" id="selected-role" name="role" value="user">
                    </div>

                    <button type="submit" class="submit-button" data-i18n="auth.registerButton">
                        <span>Create Account</span>
                        <div class="spinner"></div>
                    </button>

                    <div class="toggle-text">
                        <span data-i18n="auth.haveAccount">Already have an account?</span>
                        <button type="button" onclick="switchTab('login')" data-i18n="auth.login">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Initialize i18n on page load
        window.addEventListener('load', async () => {
            await i18n.loadLanguage();
            updatePageTranslations();
            setupLanguageSwitcher();
            setupRoleSelector();
        });

        // Language switcher
        function setupLanguageSwitcher() {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const lang = e.target.getAttribute('data-lang');
                    await i18n.switchLanguage(lang);
                    updatePageTranslations();
                    
                    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });
        }

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            
            // Clear errors
            clearErrors();
        }

        // Setup tab buttons
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
        });

        // Role selector
        function setupRoleSelector() {
            document.querySelectorAll('.role-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    document.getElementById('selected-role').value = option.getAttribute('data-role');
                });
            });
            
            // Set default selection
            document.querySelector('[data-role="user"]').classList.add('selected');
        }

        // Password strength indicator
        function updatePasswordStrength(password) {
            const bar = document.getElementById('password-strength-bar');
            const strength = calculatePasswordStrength(password);
            
            bar.className = 'password-strength-bar ' + strength;
        }

        function calculatePasswordStrength(password) {
            let score = 0;
            if (password.length >= 6) score++;
            if (password.length >= 10) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[!@#$%^&*]/.test(password)) score++;
            
            if (score <= 2) return 'weak';
            if (score <= 3) return 'medium';
            return 'strong';
        }

        // Form validation
        function validateForm(form) {
            const inputs = form.querySelectorAll('input[required]');
            let valid = true;

            inputs.forEach(input => {
                if (!input.value.trim()) {
                    markFieldError(input, true);
                    valid = false;
                } else {
                    markFieldError(input, false);
                }
            });

            return valid;
        }

        function markFieldError(input, hasError) {
            const group = input.parentElement;
            if (hasError) {
                group.classList.add('invalid');
            } else {
                group.classList.remove('invalid');
            }
        }

        function clearErrors() {
            document.querySelectorAll('.form-group').forEach(g => g.classList.remove('invalid'));
            document.querySelectorAll('input[required]').forEach(i => i.value = '');
            document.querySelectorAll('.error-message').forEach(e => {
                e.classList.remove('visible');
                e.textContent = '';
            });
        }

        // Login handler
        async function handleLogin(e) {
            e.preventDefault();
            
            const form = document.getElementById('login-form');
            if (!validateForm(form)) return;

            const btn = form.querySelector('button[type="submit"]');
            btn.classList.add('loading');
            btn.disabled = true;
            const alertDiv = document.getElementById('login-alert');

            try {
                const response = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.role);

                    alertDiv.className = 'success-message visible';
                    alertDiv.textContent = i18n.t('auth.loginSuccess', 'Logged in successfully');
                    
                    setTimeout(() => {
                        window.location.href = '/frontend/static_index.html';
                    }, 800);
                } else {
                    const error = await response.json();
                    alertDiv.className = 'error-message visible';
                    alertDiv.textContent = i18n.t('auth.invalidCredentials', 'Invalid username or password');
                }
            } catch (error) {
                alertDiv.className = 'error-message visible';
                alertDiv.textContent = i18n.t('messages.errorLoading', 'Error: ' + error.message);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Register handler
        async function handleRegister(e) {
            e.preventDefault();

            const form = document.getElementById('register-form');
            if (!validateForm(form)) return;

            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm').value;

            if (password !== confirmPassword) {
                const group = document.getElementById('register-confirm').parentElement;
                group.classList.add('invalid');
                return;
            }

            const btn = form.querySelector('button[type="submit"]');
            btn.classList.add('loading');
            btn.disabled = true;
            const alertDiv = document.getElementById('register-alert');

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('register-username').value,
                        email: document.getElementById('register-email').value || null,
                        password: password,
                        role: document.getElementById('selected-role').value
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.role);

                    alertDiv.className = 'success-message visible';
                    alertDiv.textContent = i18n.t('auth.registerSuccess', 'Account created successfully');

                    setTimeout(() => {
                        window.location.href = '/frontend/static_index.html';
                    }, 800);
                } else {
                    const error = await response.json();
                    alertDiv.className = 'error-message visible';
                    alertDiv.textContent = error.detail?.[0]?.msg || i18n.t('messages.errorLoading', 'Error creating account');
                }
            } catch (error) {
                alertDiv.className = 'error-message visible';
                alertDiv.textContent = i18n.t('messages.errorLoading', 'Error: ' + error.message);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
